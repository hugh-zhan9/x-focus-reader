name: Package Chrome extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check syntax and run tests
        run: |
          npm run check
          npm test
      - name: Build and verify the install ZIP
        run: |
          git archive --format=zip --prefix=x-focus-reader-chrome/ \
            --output=x-focus-reader-chrome.zip HEAD:extension
          unzip -t x-focus-reader-chrome.zip
          unzip -p x-focus-reader-chrome.zip x-focus-reader-chrome/manifest.json | cmp - extension/manifest.json
      - name: Upload Chrome extension ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: x-focus-reader-chrome.zip
          archive: false
          if-no-files-found: error
